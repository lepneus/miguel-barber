<style>
:root{--paper:#FAF8F5;--ink:#242523;--accent:#34594C;--detail:#AD8956;--muted:#646961;--line:#e4e6e0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Archivo,Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}button:disabled{opacity:.4;cursor:not-allowed}a{color:inherit}h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:500;margin:0}p{line-height:1.7}.shell{width:min(1120px,92%);margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:28px 0}.brand{font-family:Fraunces,Georgia,serif;font-size:23px}.brand span{color:var(--accent)}.button{display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:11px;background:var(--accent);color:white;padding:13px 18px;font-size:14px;font-weight:600;text-decoration:none}.button.secondary{background:transparent;color:var(--ink);border-color:var(--line)}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:0 18px 50px #24252308}.notice{padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:12px;font-size:13px;line-height:1.7;color:var(--muted)}.mode{margin-bottom:18px}.panel{padding-bottom:70px}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:15px 0 25px}.panel-head h1{font-size:clamp(34px,5vw,52px);letter-spacing:-1.7px}.note{font-size:13px;color:var(--muted);line-height:1.7}.actions{display:flex;gap:10px;align-items:center;justify-content:flex-start;flex-wrap:wrap}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:20px 0 26px;overflow-x:auto}.tab{white-space:nowrap;border:0;border-bottom:2px solid transparent;background:none;padding:12px 10px;font-size:13px}.tab.active{border-color:var(--accent);color:var(--accent)}.field{margin-bottom:18px}label{display:block;font-size:13px;font-weight:500;margin-bottom:8px}input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:16px}textarea{min-height:90px;resize:vertical}.filter-row{display:flex;gap:14px;align-items:end;flex-wrap:wrap}.filter-row>.field{flex:1;min-width:150px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric{padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff}.metric strong{display:block;font-size:24px;margin-top:7px}.record{padding:18px;border:1px solid var(--line);border-radius:14px;margin:12px 0;background:#fff}.record-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.record .actions{margin-top:12px}.record .button{padding:9px 12px}.badge{font-size:12px;border-radius:20px;padding:6px 10px;background:#f3ead6;color:#715316}.badge.accepted{background:#dfefe7;color:#235941}.badge.cancelled{background:#f9e3e3;color:#8a3333}.badge.completed{background:#e8eaf0;color:#384468}.row{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}.row span:first-child{color:var(--muted)}.error{color:#a43030;font-size:13px}.login{max-width:520px;margin:40px auto}.login h1{font-size:40px;margin-bottom:10px}.color-field{display:flex;justify-content:space-between;align-items:center;margin:15px 0}.color-field input{width:58px;height:40px;padding:3px}summary{cursor:pointer;line-height:1.6}#print-report{display:none}

</style>

<body>
<div class="shell"><header class="topbar"><div class="brand">Painel <span>Barbearia</span></div><a class="button secondary" href="index.html">← Site do cliente</a></header><div id="mode" class="notice mode"></div><main id="app" class="panel"></main></div>
<script>
"use strict";
let SERVICES=[{id:"corte",name:"Corte",price:40,duration:30},{id:"barba",name:"Barba",price:20,duration:20},{id:"sobrancelha",name:"Sobrancelha",price:15,duration:20}];
const DEFAULTS={eyebrow:"Cuidado nos detalhes. Simplicidade ao agendar.",title:"Seu próximo corte começa aqui.",sub:"Escolha seus serviços, encontre um horário livre e acompanhe a confirmação do barbeiro.",paper:"#FAF8F5",ink:"#242523",accent:"#34594C",detail:"#AD8956",bgImage:"",services:SERVICES,periods:[[480,720],[810,1140]]};
const FIREBASE_CONFIG={}; // Mesma configuração pública usada no index.html.
const DEMO=new URLSearchParams(location.search).get("demo")==="1",DEMO_KEY="barbearia:demo:v2";
const app=document.getElementById("app"),mode=document.getElementById("mode");
let settings={...DEFAULTS},periods=DEFAULTS.periods,onlineReady=false,remoteCall,adminAuth,loginRemote,logoutRemote,adminAuthed=false,records=[],blocks=[],adminError="";

function money(n){return new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(n)}function pad(n){return String(n).padStart(2,"0")}function clock(n){return pad(Math.floor(n/60))+":"+pad(n%60)}function fmtDate(d){return d?.split("-").reverse().join("/")||""}function brazilNow(){const p=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).map(x=>[x.type,x.value]));return{date:`${p.year}-${p.month}-${p.day}`,minute:+p.hour*60 + +p.minute}}
function validDate(date){if(typeof date!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(date))return false;const d=new Date(date+"T12:00:00Z");return Number.isFinite(+d)&&d.toISOString().slice(0,10)===date&&d.getUTCDay()!==0}
function localData(){try{return JSON.parse(localStorage.getItem(DEMO_KEY)||"null")||{records:[],blocks:[],settings:{}}}catch{return{records:[],blocks:[],settings:{}}}}function saveLocal(d){localStorage.setItem(DEMO_KEY,JSON.stringify(d))}
function transition(record,action,amount,method){if(action==="accept"&&record.status==="pending")return{status:"accepted"};if(action==="cancel"&&["pending","accepted"].includes(record.status))return{status:"cancelled"};if(action==="complete"&&record.status==="accepted"){if(!Number.isFinite(amount)||amount<0||amount>10000||!["Pix","Dinheiro","Débito","Crédito"].includes(method))throw Error("Informe valor e pagamento válidos.");return{status:"completed",paidCents:Math.round(amount*100),method}}throw Error("Esse atendimento já mudou de situação.")}
function demoDay(d,date){return{busy:[...d.records.filter(r=>r.date===date&&r.status!=="cancelled").map(r=>({start:r.time,end:r.end,id:r.id})),...d.blocks.filter(b=>b.date===date)]}}
async function api(name,p={}){if(!DEMO){if(!onlineReady)throw Error("Conexão online ainda não configurada.");return remoteCall(name,p)}const d=localData(),cfg={...DEFAULTS,...d.settings};if(name==="getPublicSettings")return cfg;if(!adminAuthed)throw Error("Entre no painel.");if(name==="adminData")return{records:d.records.filter(r=>r.date.startsWith(p.month)),blocks:d.blocks.filter(r=>r.date.startsWith(p.month))};if(name==="updateBooking"){const r=d.records.find(r=>r.id===p.id);if(!r)throw Error("Pedido não encontrado.");Object.assign(r,transition(r,p.action,p.amount,p.method));if(p.action==="complete"){r.completedAt=Date.now();r.paidDate=brazilNow().date}saveLocal(d);return r}if(name==="setBlock"){if(p.remove)d.blocks=d.blocks.filter(b=>!(b.date===p.date&&b.id===p.remove));else{if(p.start>=p.end)throw Error("O fim deve ser depois do início.");if(demoDay(d,p.date).busy.some(b=>p.start<b.end&&p.end>b.start))throw Error("Existe reserva ou bloqueio nesse intervalo.");d.blocks.push({...p,id:"block_"+Date.now(),block:true})}saveLocal(d);return{ok:true}}if(name==="savePublicSettings"){d.settings={...d.settings,...p};saveLocal(d);return{...cfg,...d.settings}}throw Error("Operação inválida.")}
function el(tag,attrs={},children=[]){const node=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")node.className=v;else if(k.startsWith("on"))node.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)node.setAttribute(k,v===true?"":String(v))}for(const child of[].concat(children))if(child!=null)node.append(child instanceof Node?child:document.createTextNode(String(child)));return node}function button(text,fn,secondary=false){return el("button",{type:"button",class:secondary?"button secondary":"button",onclick:fn},text)}function formField(label,id,type,value,attrs={}){const input=el("input",{id,type,value,...attrs});return{input,wrap:el("div",{class:"field"},[el("label",{for:id},label),input])}}function selectField(label,id,choices,value){const input=el("select",{id});for(const[v,t]of choices)input.append(el("option",{value:v,selected:v===value},t));return{input,wrap:el("div",{class:"field"},[el("label",{for:id},label),input])}}
function applySettings(c){settings={...DEFAULTS,...c};SERVICES=[...(settings.services||DEFAULTS.services)];periods=settings.periods||DEFAULTS.periods;for(const name of["paper","ink","accent","detail"])document.documentElement.style.setProperty("--"+name,settings[name])}
async function refreshAdmin(){const data=await api("adminData",{month:adminMonth});records=(data.records||[]).sort((a,b)=>(a.date+clock(a.time)).localeCompare(b.date+clock(b.time)));blocks=data.blocks||[]}
async function runAdmin(work){try{await work();await refreshAdmin();adminError="";renderAdmin()}catch(e){adminError=e?.message||"Não foi possível concluir.";renderAdmin()}}
function renderLogin(){app.replaceChildren();const card=el("section",{class:"card login"},[el("h1",{},"Área do barbeiro"),el("p",{class:"note"},DEMO?"Demonstração local. Use somente dados fictícios.":"Entre com a conta autorizada do barbeiro.")]);if(DEMO){card.append(button("Entrar na demonstração",async()=>{adminAuthed=true;await runAdmin(async()=>{})}));app.append(card);return}if(!onlineReady){card.append(el("p",{class:"notice"},"O Firebase ainda precisa ser configurado para usar o painel online."),el("a",{class:"button",href:"admin.html?demo=1"},"Abrir demonstração"));app.append(card);return}const form=el("form"),email=formField("E-mail","admin-email","email","",{required:true,autocomplete:"username"}),pass=formField("Senha","admin-password","password","",{required:true,autocomplete:"current-password"}),status=el("p",{class:"error"}),submit=el("button",{class:"button",type:"submit"},"Entrar");form.append(email.wrap,pass.wrap,submit,status);form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{await loginRemote(email.input.value,pass.input.value);adminAuthed=true;await refreshAdmin();renderAdmin()}catch(err){status.textContent=err?.message||"Não foi possível entrar.";await logoutRemote()}finally{submit.disabled=false}};card.append(form);app.append(card)}
function renderAdmin(){if(!adminAuthed)return renderLogin();app.replaceChildren();const head=el("div",{class:"panel-head"},[el("div",{},[el("p",{class:"note"},DEMO?"Modo de demonstração":"Painel conectado"),el("h1",{},"Controle da barbearia")]),button("Sair",async()=>{if(!DEMO&&logoutRemote)await logoutRemote();adminAuthed=false;records=[];blocks=[];renderLogin()},true)]);app.append(head);const tabs=el("div",{class:"tabs"});for(const[k,l]of[["overview","Resumo"],["agenda","Agenda"],["cash","Caixa"],["clients","Clientes"],["blocks","Bloqueios"],["services","Serviços e horários"],["texts","Textos"],["appearance","Aparência"]])tabs.append(el("button",{type:"button",class:"tab"+(adminTab===k?" active":""),onclick:()=>{adminTab=k;renderAdmin()}},l));app.append(tabs);if(adminError)app.append(el("p",{class:"error"},adminError));if(["overview","agenda","cash","clients","blocks"].includes(adminTab)){const month=formField("Mês consultado","admin-month","month",adminMonth);month.input.onchange=()=>{if(!/^\d{4}-\d{2}$/.test(month.input.value))return;adminMonth=month.input.value;if(!adminDate.startsWith(adminMonth))adminDate=adminMonth+"-01";runAdmin(async()=>{})};app.append(el("div",{class:"filter-row"},[month.wrap,button("Atualizar",()=>runAdmin(async()=>{}),true)]))}if(adminTab==="agenda")return renderAgenda();if(adminTab==="cash")return renderCash(false);if(adminTab==="clients")return renderClients();if(adminTab==="blocks")return renderBlocks();if(adminTab==="services")return renderServicesAdmin();if(adminTab==="texts")return renderTexts();if(adminTab==="appearance")return renderAppearance();renderCash(true)}
function metrics(items){const wrap=el("div",{class:"metrics"});for(const[l,v]of items)wrap.append(el("div",{class:"metric"},[el("span",{class:"note"},l),el("strong",{},v)]));return wrap}
function renderCash(overview){const paid=records.filter(r=>r.status==="completed"),sum=paid.reduce((n,r)=>n+(r.paidCents||0),0);app.append(metrics([["Recebido no mês",money(sum/100)],["Concluídos",paid.length],["Pendentes",records.filter(r=>r.status==="pending").length],["Confirmados",records.filter(r=>r.status==="accepted").length]]));app.append(el("p",{class:"note"},"Somente atendimentos finalizados entram no caixa."));for(const method of["Pix","Dinheiro","Débito","Crédito"])app.append(el("div",{class:"row"},[el("span",{},method),el("strong",{},money(paid.filter(r=>r.method===method).reduce((n,r)=>n+(r.paidCents||0),0)/100))]));if(!overview){app.append(button("Imprimir / salvar PDF",printCash,true));if(!paid.length)app.append(el("p",{class:"notice"},"Nenhum atendimento concluído nesse mês."));for(const r of paid)app.append(el("div",{class:"record"},[el("strong",{},r.name),el("p",{class:"note"},fmtDate(r.date)+" · "+r.method+" · "+money(r.paidCents/100)+" · Recebido em "+fmtDate(r.paidDate||r.date))]))}}
function printCash(){document.getElementById("print-report")?.remove();const report=el("section",{id:"print-report"},[el("h1",{},"Fechamento · Barbearia"),el("p",{},"Mês: "+adminMonth)]),paid=records.filter(r=>r.status==="completed");for(const r of paid)report.append(el("p",{},fmtDate(r.date)+" · "+r.name+" · "+r.method+" · "+money(r.paidCents/100)));report.append(el("h2",{},"Total recebido: "+money(paid.reduce((n,r)=>n+(r.paidCents||0),0)/100)));document.body.append(report);window.print()}
function renderAgenda(){const date=formField("Dia da agenda","admin-date","date",adminDate),filter=selectField("Situação","agenda-filter",[["all","Todas"],...Object.entries(LABELS)],agendaFilter);date.input.onchange=()=>{adminDate=date.input.value;if(adminDate.slice(0,7)!==adminMonth){adminMonth=adminDate.slice(0,7);runAdmin(async()=>{})}else renderAdmin()};filter.input.onchange=()=>{agendaFilter=filter.input.value;renderAdmin()};app.append(el("div",{class:"filter-row"},[date.wrap,filter.wrap]));const list=records.filter(r=>r.date===adminDate&&(agendaFilter==="all"||r.status===agendaFilter));if(!list.length)app.append(el("p",{class:"notice"},"Nenhum atendimento para esse dia e filtro."));for(const r of list){const card=el("article",{class:"record"},[el("div",{class:"record-head"},[el("strong",{},clock(r.time)+" · "+r.name),el("span",{class:"badge "+r.status},LABELS[r.status])]),el("p",{class:"note"},r.services.map(s=>s.name).join(" + ")+" · "+money(r.price)+" · "+r.phone)]),row=el("div",{class:"actions"});if(r.status==="pending")row.append(button("Aceitar",()=>runAdmin(()=>api("updateBooking",{id:r.id,action:"accept"}))));if(["pending","accepted"].includes(r.status))row.append(button("Cancelar",()=>{if(confirm("Cancelar este atendimento e liberar o horário?"))runAdmin(()=>api("updateBooking",{id:r.id,action:"cancel"}))},true));if(r.status==="accepted")row.append(button("Finalizar atendimento",()=>paymentForm(card,r)));card.append(row);app.append(card)}}
function paymentForm(card,r){if(card.querySelector("form"))return;const form=el("form"),amount=formField("Valor cobrado (R$)","paid-"+r.id,"number",r.price,{required:true,min:0,max:10000,step:"0.01"}),method=selectField("Forma de pagamento","method-"+r.id,["Pix","Dinheiro","Débito","Crédito"].map(s=>[s,s]),"Pix"),status=el("p",{class:"error"}),submit=el("button",{type:"submit",class:"button"},"Confirmar recebimento");form.append(amount.wrap,method.wrap,submit,status);form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{await api("updateBooking",{id:r.id,action:"complete",amount:Number(amount.input.value),method:method.input.value});await refreshAdmin();renderAdmin()}catch(err){status.textContent=err?.message||"Erro ao finalizar.";submit.disabled=false}};card.append(form)}
function renderClients(){const field=formField("Buscar cliente no mês","client-search","search",clientSearch,{placeholder:"Nome ou telefone"}),list=el("div");app.append(field.wrap,el("p",{class:"note"},"Histórico dos clientes no mês selecionado."),list);function draw(){list.replaceChildren();const groups=new Map();for(const r of records){const phone=r.phone.replace(/\D/g,"").replace(/^55(?=\d{10,11}$)/,"");if(!groups.has(phone))groups.set(phone,[]);groups.get(phone).push(r)}for(const entries of[...groups.values()].sort((a,b)=>a[0].name.localeCompare(b[0].name))){const r=entries[0];if(!(r.name+" "+r.phone).toLowerCase().includes(clientSearch.toLowerCase()))continue;const details=el("details",{class:"record"},[el("summary",{},r.name+" · "+r.phone+" · "+entries.length+" atendimento(s)")]);for(const b of entries)details.append(el("p",{class:"note"},fmtDate(b.date)+" · "+clock(b.time)+" · "+LABELS[b.status]+(b.status==="completed"?" · "+money(b.paidCents/100):"")));list.append(details)}if(!list.children.length)list.append(el("p",{class:"notice"},"Nenhum cliente encontrado."))}field.input.oninput=()=>{clientSearch=field.input.value;draw()};draw()}
function timeMinutes(v){const[h,m]=v.split(":").map(Number);return h*60+m}
function renderBlocks(){const form=el("form"),date=formField("Data do bloqueio","block-date","date",adminDate,{required:true,min:brazilNow().date}),start=formField("Das","block-start","time","08:00",{required:true,step:600}),end=formField("Até","block-end","time","19:00",{required:true,step:600}),label=formField("Motivo","block-label","text","",{maxlength:100,placeholder:"Folga, compromisso…"}),status=el("p",{class:"error"}),submit=el("button",{type:"submit",class:"button"},"Bloquear intervalo");form.append(date.wrap,el("div",{class:"filter-row"},[start.wrap,end.wrap]),label.wrap,submit,status);form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{if(!validDate(date.input.value))throw Error("Escolha uma data válida, de segunda a sábado.");await api("setBlock",{date:date.input.value,start:timeMinutes(start.input.value),end:timeMinutes(end.input.value),label:label.input.value});adminMonth=date.input.value.slice(0,7);await refreshAdmin();renderAdmin()}catch(err){status.textContent=err?.message||"Erro ao bloquear.";submit.disabled=false}};app.append(form,el("p",{class:"note"},"Reservas existentes precisam ser canceladas antes de bloquear o mesmo intervalo."));for(const b of blocks)app.append(el("div",{class:"record"},[el("p",{},fmtDate(b.date)+" · "+clock(b.start)+"–"+clock(b.end)+" · "+(b.label||"Indisponível")),button("Liberar intervalo",()=>runAdmin(()=>api("setBlock",{date:b.date,remove:b.id})),true)]))}
async function saveSettings(candidate,status){status.textContent="Salvando…";try{applySettings(await api("savePublicSettings",candidate));status.textContent=DEMO?"Salvo na demonstração deste navegador.":"Alterações salvas para todos os dispositivos."}catch(e){status.textContent=e?.message||"Não foi possível salvar."}}
function renderServicesAdmin(){const form=el("form"),fields=[];for(const s of SERVICES){const price=formField(s.name+" · preço (R$)","price-"+s.id,"number",s.price,{min:0,max:10000,step:".01",required:true}),duration=formField("Duração (minutos)","duration-"+s.id,"number",s.duration,{min:10,max:180,step:10,required:true});fields.push({s,price,duration});form.append(el("div",{class:"filter-row"},[price.wrap,duration.wrap]))}const times=[];periods.forEach((p,i)=>{const a=formField("Período "+(i+1)+" · início","period-a-"+i,"time",clock(p[0]),{required:true,step:600}),b=formField("Fim","period-b-"+i,"time",clock(p[1]),{required:true,step:600});times.push([a,b]);form.append(el("div",{class:"filter-row"},[a.wrap,b.wrap]))});const status=el("p",{class:"note"});form.append(el("p",{class:"notice"},"Alterações valem para novos pedidos; atendimentos já marcados mantêm preço e duração."),el("button",{class:"button",type:"submit"},"Salvar serviços e horários"),status);form.onsubmit=async e=>{e.preventDefault();const ps=times.map(([a,b])=>[timeMinutes(a.input.value),timeMinutes(b.input.value)]);if(ps.some(([a,b])=>a>=b||a%10||b%10)||ps[0][1]>ps[1][0]){status.textContent="Confira os intervalos: sem sobreposição e em múltiplos de 10 minutos.";return}await saveSettings({...settings,services:fields.map(({s,price,duration})=>({...s,price:Number(price.input.value),duration:Number(duration.input.value)})),periods:ps},status)};app.append(form)}
