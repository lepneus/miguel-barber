<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FAF8F5">
<title>Painel do Barbeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAF8F5;--ink:#242523;--accent:#34594C;--detail:#AD8956;--muted:#646961;--line:#e4e6e0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Archivo,Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}button:disabled{opacity:.4;cursor:not-allowed}a{color:inherit}h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:500;margin:0}p{line-height:1.7}.shell{width:min(1120px,92%);margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:28px 0}.brand{font-family:Fraunces,Georgia,serif;font-size:23px}.brand span{color:var(--accent)}.button{display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:11px;background:var(--accent);color:white;padding:13px 18px;font-size:14px;font-weight:600;text-decoration:none}.button.secondary{background:transparent;color:var(--ink);border-color:var(--line)}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:0 18px 50px #24252308}.notice{padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:12px;font-size:13px;line-height:1.7;color:var(--muted)}.mode{margin-bottom:18px}.panel{padding-bottom:70px}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:15px 0 25px}.panel-head h1{font-size:clamp(34px,5vw,52px);letter-spacing:-1.7px}.note{font-size:13px;color:var(--muted);line-height:1.7}.actions{display:flex;gap:10px;align-items:center;justify-content:flex-start;flex-wrap:wrap}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:20px 0 26px;overflow-x:auto}.tab{white-space:nowrap;border:0;border-bottom:2px solid transparent;background:none;padding:12px 10px;font-size:13px}.tab.active{border-color:var(--accent);color:var(--accent)}.field{margin-bottom:18px}label{display:block;font-size:13px;font-weight:500;margin-bottom:8px}input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:16px}textarea{min-height:90px;resize:vertical}.filter-row{display:flex;gap:14px;align-items:end;flex-wrap:wrap}.filter-row>.field{flex:1;min-width:150px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric{padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff}.metric strong{display:block;font-size:24px;margin-top:7px}.record{padding:18px;border:1px solid var(--line);border-radius:14px;margin:12px 0;background:#fff}.record-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.record .actions{margin-top:12px}.record .button{padding:9px 12px}.badge{font-size:12px;border-radius:20px;padding:6px 10px;background:#f3ead6;color:#715316}.badge.accepted{background:#dfefe7;color:#235941}.badge.cancelled{background:#f9e3e3;color:#8a3333}.badge.completed{background:#e8eaf0;color:#384468}.badge.expired{background:#eee;color:#666}.row{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}.row span:first-child{color:var(--muted)}.error{color:#a43030;font-size:13px}.login{max-width:520px;margin:40px auto}.login h1{font-size:40px;margin-bottom:10px}.color-field{display:flex;justify-content:space-between;align-items:center;margin:15px 0}.color-field input{width:58px;height:40px;padding:3px}summary{cursor:pointer;line-height:1.6}#print-report{display:none}

.agenda-calendar{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin:6px 0 18px}
.agenda-cal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.agenda-cal-title{font-family:Fraunces,Georgia,serif;font-size:24px;text-transform:capitalize}
.agenda-cal-actions{display:flex;gap:8px;align-items:center}
.cal-mini{border:1px solid var(--line);background:transparent;border-radius:10px;padding:9px 12px;font-weight:600}
.agenda-week,.agenda-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.agenda-week{margin-bottom:6px}.agenda-week span{text-align:center;font-size:11px;color:var(--muted);padding:5px 0}
.agenda-day{min-height:72px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px;text-align:left;position:relative}
.agenda-day:hover{border-color:var(--accent)}
.agenda-day.selected{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 6%,white)}
.agenda-day.today .day-number{color:var(--accent)}
.agenda-day.empty{visibility:hidden}
.agenda-day.sunday{opacity:.45}
.day-number{font-weight:700;font-size:14px}
.day-count{position:absolute;right:7px;top:7px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;display:grid;place-items:center}
.day-dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:14px}
.day-dot{width:6px;height:6px;border-radius:50%;background:var(--detail)}
.day-dot.accepted{background:var(--accent)}.day-dot.cancelled,.day-dot.expired{opacity:.25}
.day-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 16px}
.day-summary .metric{margin:0}
@media(max-width:600px){.agenda-calendar{padding:12px}.agenda-week,.agenda-days{gap:3px}.agenda-day{min-height:56px;padding:6px}.day-count{right:4px;top:4px}.day-summary{grid-template-columns:1fr 1fr}.agenda-cal-title{font-size:21px}}


.workdays{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:12px 0 22px}
.workday{border:1px solid var(--line);border-radius:12px;padding:12px 8px;background:#fff;text-align:center;cursor:pointer;user-select:none}
.workday input{width:auto;margin:0 0 7px}
.workday.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,white)}
.schedule-box{border:1px solid var(--line);border-radius:16px;padding:18px;margin:18px 0;background:#fff}
.schedule-box h3{margin:0 0 6px;font-size:22px}
@media(max-width:700px){.workdays{grid-template-columns:repeat(4,1fr)}}
@media(max-width:420px){.workdays{grid-template-columns:repeat(2,1fr)}}

@media(max-width:800px){.metrics{grid-template-columns:repeat(2,1fr)}.panel-head{flex-direction:column}.topbar{align-items:flex-start}.card{padding:19px}}
@media(max-width:480px){.metric{padding:13px}.metric strong{font-size:21px}.record{padding:14px}.tabs{margin-left:-4px;margin-right:-4px}.topbar{flex-wrap:wrap}}
@media print{body>*{display:none!important}body>#print-report{display:block!important;background:#fff;color:#000;padding:20px}#print-report h1{font-size:28px}#print-report p{border-bottom:1px solid #ddd;padding-bottom:8px}}
</style>
</head>
<body>
<div class="shell"><header class="topbar"><div class="brand">Painel <span>Barbearia</span></div><a class="button secondary" href="index.html">← Site do cliente</a></header><div id="mode" class="notice mode"></div><main id="app" class="panel"></main></div>
<script>

  apiKey:"AIzaSyDkaDl6pxcPVIwMT35yr0tKsvBS4loOatI",

let settings={...DEFAULTS},workingDays=[...DEFAULTS.workingDays],periods=DEFAULTS.periods,onlineReady=false,remoteCall,adminAuth,loginRemote,logoutRemote,adminAuthed=false,records=[],blocks=[],adminError="";
let adminTab="overview",adminMonth=brazilNow().date.slice(0,7),adminDate=brazilNow().date,agendaFilter="all",clientSearch="";
const LABELS={pending:"Aguardando confirmação",accepted:"Confirmado",cancelled:"Cancelado",completed:"Concluído",expired:"Expirado"};
const PENDING_TTL=60*60*1000;
function bookingExpiry(r){return Number(r?.expiresAt)||(Number(r?.createdAt)||0)+PENDING_TTL}
function effectiveStatus(r){return r?.status==="pending"&&bookingExpiry(r)&&Date.now()>=bookingExpiry(r)?"expired":r?.status}
function normalizeRecord(r){const status=effectiveStatus(r);return status===r.status?r:{...r,status}}
function money(n){return new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(n)}function pad(n){return String(n).padStart(2,"0")}function clock(n){return pad(Math.floor(n/60))+":"+pad(n%60)}function fmtDate(d){return d?.split("-").reverse().join("/")||""}function brazilNow(){const p=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).map(x=>[x.type,x.value]));return{date:`${p.year}-${p.month}-${p.day}`,minute:+p.hour*60 + +p.minute}}
function validDate(date){if(typeof date!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(date))return false;const d=new Date(date+"T12:00:00Z");return Number.isFinite(+d)&&d.toISOString().slice(0,10)===date}
function localData(){try{return JSON.parse(localStorage.getItem(DEMO_KEY)||"null")||{records:[],blocks:[],settings:{}}}catch{return{records:[],blocks:[],settings:{}}}}function saveLocal(d){localStorage.setItem(DEMO_KEY,JSON.stringify(d))}
function transition(record,action,amount,method){const status=effectiveStatus(record);if(action==="accept"&&status==="pending")return{status:"accepted",acceptedAt:Date.now()};if(action==="cancel"&&["pending","accepted"].includes(status))return{status:"cancelled"};if(action==="complete"&&status==="accepted"){if(!Number.isFinite(amount)||amount<0||amount>10000||!["Pix","Dinheiro","Débito","Crédito"].includes(method))throw Error("Informe valor e pagamento válidos.");return{status:"completed",paidCents:Math.round(amount*100),method}}if(status==="expired")throw Error("A reserva expirou após 1 hora e o horário já foi liberado.");throw Error("Esse atendimento já mudou de situação.")}
function demoDay(d,date){return{busy:[...d.records.filter(r=>r.date===date&&!(["cancelled","expired"].includes(effectiveStatus(r)))).map(r=>({start:r.time,end:r.end,id:r.id})),...d.blocks.filter(b=>b.date===date)]}}
async function api(name,p={}){if(!DEMO){if(!onlineReady)throw Error("Conexão online ainda não configurada.");return remoteCall(name,p)}const d=localData(),cfg={...DEFAULTS,...d.settings};if(name==="getPublicSettings")return cfg;if(!adminAuthed)throw Error("Entre no painel.");if(name==="adminData")return{records:d.records.filter(r=>r.date.startsWith(p.month)).map(normalizeRecord),blocks:d.blocks.filter(r=>r.date.startsWith(p.month))};if(name==="updateBooking"){const r=d.records.find(r=>r.id===p.id);if(!r)throw Error("Pedido não encontrado.");if(p.action==="verifyPhone"){if(effectiveStatus(r)!=="pending")throw Error(effectiveStatus(r)==="expired"?"A reserva já expirou.":"Esse pedido não está mais pendente.");r.phoneVerified=true;r.phoneVerifiedAt=Date.now();saveLocal(d);return r}Object.assign(r,transition(r,p.action,p.amount,p.method));if(p.action==="complete"){r.completedAt=Date.now();r.paidDate=brazilNow().date}saveLocal(d);return r}if(name==="setBlock"){if(p.remove)d.blocks=d.blocks.filter(b=>!(b.date===p.date&&b.id===p.remove));else{if(p.start>=p.end)throw Error("O fim deve ser depois do início.");if(demoDay(d,p.date).busy.some(b=>p.start<b.end&&p.end>b.start))throw Error("Existe reserva ou bloqueio nesse intervalo.");d.blocks.push({...p,id:"block_"+Date.now(),block:true})}saveLocal(d);return{ok:true}}if(name==="savePublicSettings"){d.settings={...d.settings,...p};saveLocal(d);return{...cfg,...d.settings}}throw Error("Operação inválida.")}
function el(tag,attrs={},children=[]){const node=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")node.className=v;else if(k.startsWith("on"))node.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)node.setAttribute(k,v===true?"":String(v))}for(const child of[].concat(children))if(child!=null)node.append(child instanceof Node?child:document.createTextNode(String(child)));return node}function button(text,fn,secondary=false){return el("button",{type:"button",class:secondary?"button secondary":"button",onclick:fn},text)}function formField(label,id,type,value,attrs={}){const input=el("input",{id,type,value,...attrs});return{input,wrap:el("div",{class:"field"},[el("label",{for:id},label),input])}}function selectField(label,id,choices,value){const input=el("select",{id});for(const[v,t]of choices)input.append(el("option",{value:v,selected:v===value},t));return{input,wrap:el("div",{class:"field"},[el("label",{for:id},label),input])}}
function applySettings(c){settings={...DEFAULTS,...c};SERVICES=[...(settings.services||DEFAULTS.services)];workingDays=Array.isArray(settings.workingDays)?settings.workingDays.map(Number):[...DEFAULTS.workingDays];periods=settings.periods||DEFAULTS.periods;for(const name of["paper","ink","accent","detail"])document.documentElement.style.setProperty("--"+name,settings[name])}
async function refreshAdmin(){const data=await api("adminData",{month:adminMonth});records=(data.records||[]).map(normalizeRecord).sort((a,b)=>(a.date+clock(a.time)).localeCompare(b.date+clock(b.time)));blocks=data.blocks||[]}
async function runAdmin(work){try{await work();await refreshAdmin();adminError="";renderAdmin()}catch(e){adminError=e?.message||"Não foi possível concluir.";renderAdmin()}}
function renderLogin(){app.replaceChildren();const card=el("section",{class:"card login"},[el("h1",{},"Área do barbeiro"),el("p",{class:"note"},DEMO?"Demonstração local. Use somente dados fictícios.":"Entre com a conta autorizada do barbeiro.")]);if(DEMO){card.append(button("Entrar na demonstração",async()=>{adminAuthed=true;await runAdmin(async()=>{})}));app.append(card);return}if(!onlineReady){card.append(el("p",{class:"notice"},"O Firebase ainda precisa ser configurado para usar o painel online."),el("a",{class:"button",href:"admin.html?demo=1"},"Abrir demonstração"));app.append(card);return}const form=el("form"),email=formField("E-mail","admin-email","email","",{required:true,autocomplete:"username"}),pass=formField("Senha","admin-password","password","",{required:true,autocomplete:"current-password"}),status=el("p",{class:"error"}),submit=el("button",{class:"button",type:"submit"},"Entrar");form.append(email.wrap,pass.wrap,submit,status);form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{await loginRemote(email.input.value,pass.input.value);adminAuthed=true;await refreshAdmin();renderAdmin()}catch(err){status.textContent=err?.message||"Não foi possível entrar.";await logoutRemote()}finally{submit.disabled=false}};card.append(form);app.append(card)}
function renderAdmin(){if(!adminAuthed)return renderLogin();app.replaceChildren();const head=el("div",{class:"panel-head"},[el("div",{},[el("p",{class:"note"},DEMO?"Modo de demonstração":"Painel conectado"),el("h1",{},"Controle da barbearia")]),button("Sair",async()=>{if(!DEMO&&logoutRemote)await logoutRemote();adminAuthed=false;records=[];blocks=[];renderLogin()},true)]);app.append(head);const tabs=el("div",{class:"tabs"});for(const[k,l]of[["overview","Resumo"],["agenda","Agenda"],["cash","Caixa"],["clients","Clientes"],["blocks","Bloqueios"],["services","Serviços e horários"],["texts","Textos"],["appearance","Aparência"]])tabs.append(el("button",{type:"button",class:"tab"+(adminTab===k?" active":""),onclick:()=>{adminTab=k;renderAdmin()}},l));app.append(tabs);if(adminError)app.append(el("p",{class:"error"},adminError));if(["overview","cash","clients","blocks"].includes(adminTab)){const month=formField("Mês consultado","admin-month","month",adminMonth);month.input.onchange=()=>{if(!/^\d{4}-\d{2}$/.test(month.input.value))return;adminMonth=month.input.value;if(!adminDate.startsWith(adminMonth))adminDate=adminMonth+"-01";runAdmin(async()=>{})};app.append(el("div",{class:"filter-row"},[month.wrap,button("Atualizar",()=>runAdmin(async()=>{}),true)]))}if(adminTab==="agenda")return renderAgenda();if(adminTab==="cash")return renderCash(false);if(adminTab==="clients")return renderClients();if(adminTab==="blocks")return renderBlocks();if(adminTab==="services")return renderServicesAdmin();if(adminTab==="texts")return renderTexts();if(adminTab==="appearance")return renderAppearance();renderCash(true)}

function renderCash(overview){const paid=records.filter(r=>r.status==="completed"),sum=paid.reduce((n,r)=>n+(r.paidCents||0),0);app.append(metrics([["Recebido no mês",money(sum/100)],["Concluídos",paid.length],["Pendentes",records.filter(r=>r.status==="pending").length],["Confirmados",records.filter(r=>r.status==="accepted").length]]));app.append(el("p",{class:"note"},"Somente atendimentos finalizados entram no caixa."));for(const method of["Pix","Dinheiro","Débito","Crédito"])app.append(el("div",{class:"row"},[el("span",{},method),el("strong",{},money(paid.filter(r=>r.method===method).reduce((n,r)=>n+(r.paidCents||0),0)/100))]));if(!overview){app.append(button("Imprimir / salvar PDF",printCash,true));if(!paid.length)app.append(el("p",{class:"notice"},"Nenhum atendimento concluído nesse mês."));for(const r of paid)app.append(el("div",{class:"record"},[el("strong",{},r.name),el("p",{class:"note"},fmtDate(r.date)+" · "+r.method+" · "+money(r.paidCents/100)+" · Recebido em "+fmtDate(r.paidDate||r.date))]))}}
function printCash(){document.getElementById("print-report")?.remove();const report=el("section",{id:"print-report"},[el("h1",{},"Fechamento · Barbearia"),el("p",{},"Mês: "+adminMonth)]),paid=records.filter(r=>r.status==="completed");for(const r of paid)report.append(el("p",{},fmtDate(r.date)+" · "+r.name+" · "+r.method+" · "+money(r.paidCents/100)));report.append(el("h2",{},"Total recebido: "+money(paid.reduce((n,r)=>n+(r.paidCents||0),0)/100)));document.body.append(report);window.print()}
function renderAgenda(){
 function monthTitle(ym){
  const [y,m]=ym.split("-").map(Number);
  return new Intl.DateTimeFormat("pt-BR",{month:"long",year:"numeric"}).format(new Date(y,m-1,1));
 }
 async function changeMonth(delta){
  const [y,m]=adminMonth.split("-").map(Number),d=new Date(y,m-1+delta,1);
  adminMonth=d.getFullYear()+"-"+pad(d.getMonth()+1);
  adminDate=adminMonth+"-01";
  await runAdmin(async()=>{});
 }
 async function goToday(){
  const today=brazilNow().date,month=today.slice(0,7);
  if(month!==adminMonth){adminMonth=month;adminDate=today;await runAdmin(async()=>{});}
  else{adminDate=today;renderAdmin();}
 }

 const calendar=el("section",{class:"agenda-calendar"});
 const head=el("div",{class:"agenda-cal-head"},[
  el("strong",{class:"agenda-cal-title"},monthTitle(adminMonth)),
  el("div",{class:"agenda-cal-actions"},[
   el("button",{type:"button",class:"cal-mini",onclick:()=>changeMonth(-1),"aria-label":"Mês anterior"},"‹"),
   el("button",{type:"button",class:"cal-mini",onclick:goToday},"Hoje"),
   el("button",{type:"button",class:"cal-mini",onclick:()=>changeMonth(1),"aria-label":"Próximo mês"},"›")
  ])

 const week=el("div",{class:"agenda-week"},["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].map(x=>el("span",{},x)));
 const days=el("div",{class:"agenda-days"});
 const [y,m]=adminMonth.split("-").map(Number),first=new Date(y,m-1,1),last=new Date(y,m,0),today=brazilNow().date;
 for(let i=0;i<first.getDay();i++)days.append(el("span",{class:"agenda-day empty"},""));
 for(let day=1;day<=last.getDate();day++){
  const date=adminMonth+"-"+pad(day),dow=new Date(y,m-1,day,12).getDay();
  const items=records.filter(r=>r.date===date&&r.status!=="cancelled"&&r.status!=="expired");
  const cls="agenda-day"+(date===adminDate?" selected":"")+(date===today?" today":"")+(!workingDays.includes(dow)?" sunday":"");
  const btn=el("button",{type:"button",class:cls,onclick:()=>{adminDate=date;renderAdmin()}},[
   el("span",{class:"day-number"},day)
  ]);
  if(items.length)btn.append(el("span",{class:"day-count"},items.length));
  const dots=el("span",{class:"day-dots"});
  items.slice(0,6).forEach(r=>dots.append(el("span",{class:"day-dot "+r.status,title:LABELS[r.status]})));
  btn.append(dots);days.append(btn);
 }
 calendar.append(head,week,days);
 app.append(calendar);

 const filter=selectField("Mostrar","agenda-filter",[["all","Todos os atendimentos"],...Object.entries(LABELS)],agendaFilter);
 filter.input.onchange=()=>{agendaFilter=filter.input.value;renderAdmin()};
 const chosen=records.filter(r=>r.date===adminDate);
 const active=chosen.filter(r=>!["cancelled","expired"].includes(r.status));
 app.append(
  el("div",{class:"day-summary"},[
   el("div",{class:"metric"},[el("span",{class:"note"},"Dia escolhido"),el("strong",{},fmtDate(adminDate))]),
   el("div",{class:"metric"},[el("span",{class:"note"},"Atendimentos"),el("strong",{},active.length)]),
   el("div",{class:"metric"},[el("span",{class:"note"},"Pendentes"),el("strong",{},chosen.filter(r=>r.status==="pending").length)])
  ]),
  filter.wrap
 );

 const list=chosen.filter(r=>agendaFilter==="all"||r.status===agendaFilter);
 if(!list.length)app.append(el("p",{class:"notice"},"Nenhum atendimento para esse dia e filtro."));
 for(const r of list){
  const verifyText=r.phoneVerified?"WhatsApp verificado":"WhatsApp pendente";
  const code=r.verificationCode?" · código "+r.verificationCode:"";
  const expiryNote=r.status==="pending"?" · reserva expira em "+Math.max(1,Math.ceil((bookingExpiry(r)-Date.now())/60000))+" min":r.status==="expired"?" · horário liberado":"";
  const card=el("article",{class:"record"},[
   el("div",{class:"record-head"},[el("strong",{},clock(r.time)+" · "+r.name),el("span",{class:"badge "+r.status},LABELS[r.status])]),
   el("p",{class:"note"},r.services.map(s=>s.name).join(" + ")+" · "+money(r.price)+" · "+r.phone),
   el("p",{class:"note"},verifyText+code+expiryNote)
  ]),row=el("div",{class:"actions"});
  if(r.status==="pending"&&!r.phoneVerified)row.append(button("Marcar WhatsApp verificado",()=>runAdmin(()=>api("updateBooking",{id:r.id,action:"verifyPhone"}))));
  if(r.status==="pending"&&r.phoneVerified)row.append(button("Aceitar",()=>runAdmin(()=>api("updateBooking",{id:r.id,action:"accept"}))));
  if(["pending","accepted"].includes(r.status))row.append(button("Cancelar",()=>{if(confirm("Cancelar este atendimento e liberar o horário?"))runAdmin(()=>api("updateBooking",{id:r.id,action:"cancel"}))},true));

}
function paymentForm(card,r){if(card.querySelector("form"))return;const form=el("form"),amount=formField("Valor cobrado (R$)","paid-"+r.id,"number",r.price,{required:true,min:0,max:10000,step:"0.01"}),method=selectField("Forma de pagamento","method-"+r.id,["Pix","Dinheiro","Débito","Crédito"].map(s=>[s,s]),"Pix"),status=el("p",{class:"error"}),submit=el("button",{type:"submit",class:"button"},"Confirmar recebimento");form.append(amount.wrap,method.wrap,submit,status);form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{await api("updateBooking",{id:r.id,action:"complete",amount:Number(amount.input.value),method:method.input.value});await refreshAdmin();renderAdmin()}catch(err){status.textContent=err?.message||"Erro ao finalizar.";submit.disabled=false}};card.append(form)}
function renderClients(){const field=formField("Buscar cliente no mês","client-search","search",clientSearch,{placeholder:"Nome ou telefone"}),list=el("div");app.append(field.wrap,el("p",{class:"note"},"Histórico dos clientes no mês selecionado."),list);function draw(){list.replaceChildren();const groups=new Map();for(const r of records){const phone=r.phone.replace(/\D/g,"").replace(/^55(?=\d{10,11}$)/,"");if(!groups.has(phone))groups.set(phone,[]);groups.get(phone).push(r)}for(const entries of[...groups.values()].sort((a,b)=>a[0].name.localeCompare(b[0].name))){const r=entries[0];if(!(r.name+" "+r.phone).toLowerCase().includes(clientSearch.toLowerCase()))continue;const details=el("details",{class:"record"},[el("summary",{},r.name+" · "+r.phone+" · "+entries.length+" atendimento(s)")]);for(const b of entries)details.append(el("p",{class:"note"},fmtDate(b.date)+" · "+clock(b.time)+" · "+LABELS[b.status]+(b.status==="completed"?" · "+money(b.paidCents/100):"")));list.append(details)}if(!list.children.length)list.append(el("p",{class:"notice"},"Nenhum cliente encontrado."))}field.input.oninput=()=>{clientSearch=field.input.value;draw()};draw()}
function timeMinutes(v){const[h,m]=v.split(":").map(Number);return h*60+m}
function renderBlocks(){const form=el("form"),date=formField("Data do bloqueio","block-date","date",adminDate,{required:true,min:brazilNow().date}),start=formField("Das","block-start","time","08:00",{required:true,step:600}),end=formField("Até","block-end","time","19:00",{required:true,step:600}),label=formField("Motivo","block-label","text","",{maxlength:100,placeholder:"Folga, compromisso…"}),status=el("p",{class:"error"}),submit=el("button",{type:"submit",class:"button"},"Bloquear intervalo");form.append(date.wrap,el("div",{class:"filter-row"},[start.wrap,end.wrap]),label.wrap,submit,status);form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{if(!validDate(date.input.value))throw Error("Escolha uma data válida.");await api("setBlock",{date:date.input.value,start:timeMinutes(start.input.value),end:timeMinutes(end.input.value),label:label.input.value});adminMonth=date.input.value.slice(0,7);await refreshAdmin();renderAdmin()}catch(err){status.textContent=err?.message||"Erro ao bloquear.";submit.disabled=false}};app.append(form,el("p",{class:"note"},"Reservas existentes precisam ser canceladas antes de bloquear o mesmo intervalo."));for(const b of blocks)app.append(el("div",{class:"record"},[el("p",{},fmtDate(b.date)+" · "+clock(b.start)+"–"+clock(b.end)+" · "+(b.label||"Indisponível")),button("Liberar intervalo",()=>runAdmin(()=>api("setBlock",{date:b.date,remove:b.id})),true)]))}
async function saveSettings(candidate,status){status.textContent="Salvando…";try{applySettings(await api("savePublicSettings",candidate));status.textContent=DEMO?"Salvo na demonstração deste navegador.":"Alterações salvas para todos os dispositivos."}catch(e){status.textContent=e?.message||"Não foi possível salvar."}}
function renderServicesAdmin(){
 const form=el("form"),serviceList=el("div"),status=el("p",{class:"note"});
 let draft=SERVICES.map(s=>({...s}));
 const dayNames=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
 const selectedDays=new Set(workingDays.map(Number));

 function drawServices(){
  serviceList.replaceChildren();
  draft.forEach((s,i)=>{
   const name=formField("Nome do serviço","service-name-"+i,"text",s.name,{required:true,maxlength:60,placeholder:"Ex.: Corte"}),
         price=formField("Valor (R$)","service-price-"+i,"number",s.price,{required:true,min:0,max:10000,step:".01"}),
         duration=formField("Duração (minutos)","service-duration-"+i,"number",s.duration,{required:true,min:10,max:180,step:10});
   name.input.oninput=()=>draft[i].name=name.input.value;
   price.input.oninput=()=>draft[i].price=Number(price.input.value);
   duration.input.oninput=()=>draft[i].duration=Number(duration.input.value);
   const card=el("div",{class:"record"},[el("div",{class:"filter-row"},[name.wrap,price.wrap,duration.wrap])]);
   if(draft.length>1)card.append(button("Remover serviço",()=>{draft.splice(i,1);drawServices()},true));
   serviceList.append(card);
  });
 }

 drawServices();
 const add=button("+ Adicionar serviço",()=>{
  draft.push({id:"servico_"+crypto.randomUUID(),name:"Novo serviço",price:0,duration:30});
  drawServices();
 },true);

 const workdaysWrap=el("div",{class:"workdays"});
 dayNames.forEach((label,day)=>{
  const check=el("input",{type:"checkbox",checked:selectedDays.has(day)});
  const box=el("label",{class:"workday"+(selectedDays.has(day)?" active":"")},[check,el("div",{},label)]);
  check.onchange=()=>{
   if(check.checked)selectedDays.add(day);else selectedDays.delete(day);
   box.classList.toggle("active",check.checked);
  };
  workdaysWrap.append(box);
 });

 const times=[],scheduleBox=el("div",{class:"schedule-box"},[
  el("h3",{},"Dias e horários de atendimento"),
  el("p",{class:"note"},"Marque os dias em que a barbearia atende. Os horários abaixo valem para todos os dias marcados."),
  workdaysWrap
 ]);
 periods.forEach((p,i)=>{
  const a=formField("Período "+(i+1)+" · início","period-a-"+i,"time",clock(p[0]),{required:true,step:600}),
        b=formField("Período "+(i+1)+" · fim","period-b-"+i,"time",clock(p[1]),{required:true,step:600});
  times.push([a,b]);
  scheduleBox.append(el("div",{class:"filter-row"},[a.wrap,b.wrap]));
 });

 form.append(
  el("p",{class:"notice"},"O barbeiro pode editar serviços, valores, duração, dias de trabalho e horários. As mudanças valem para novos agendamentos; os antigos mantêm os dados originais."),
  serviceList,
  add,
  scheduleBox,
  el("button",{class:"button",type:"submit"},"Salvar serviços, dias e horários"),
  status
 );

 form.onsubmit=async e=>{
  e.preventDefault();
  const clean=draft.map(s=>({id:s.id,name:String(s.name||"").trim(),price:Number(s.price),duration:Number(s.duration)}));
  if(!clean.length||clean.some(s=>!s.name||!Number.isFinite(s.price)||s.price<0||!Number.isFinite(s.duration)||s.duration<10||s.duration>180||s.duration%10)){
   status.textContent="Confira os serviços: nome, valor e duração em múltiplos de 10 minutos.";return;
  }
  const names=clean.map(s=>s.name.toLowerCase());
  if(new Set(names).size!==names.length){status.textContent="Não use dois serviços com o mesmo nome.";return;}
  const days=[...selectedDays].sort((a,b)=>a-b);
  if(!days.length){status.textContent="Selecione pelo menos um dia de atendimento.";return;}
  const ps=times.map(([a,b])=>[timeMinutes(a.input.value),timeMinutes(b.input.value)]);
  if(ps.some(([a,b])=>a>=b||a%10||b%10)||ps.some((p,i)=>i&&ps[i-1][1]>p[0])){
   status.textContent="Confira os horários: sem sobreposição e em múltiplos de 10 minutos.";return;
  }
  await saveSettings({...settings,services:clean,workingDays:days,periods:ps},status);
 };
 app.append(form);
}
function renderTexts(){const form=el("form"),fields={};for(const[k,l]of[["eyebrow","Frase acima do título"],["title","Título principal"],["sub","Texto de apoio"]]){const input=el("textarea",{id:"edit-"+k,maxlength:k==="sub"?600:180},settings[k]);fields[k]=input;form.append(el("div",{class:"field"},[el("label",{for:"edit-"+k},l),input]))}const status=el("p",{class:"note"});form.append(el("button",{type:"submit",class:"button"},"Salvar textos"),status);form.onsubmit=e=>{e.preventDefault();const candidate={...settings};for(const k of Object.keys(fields))candidate[k]=fields[k].value.trim()||DEFAULTS[k];saveSettings(candidate,status)};app.append(form)}
function renderAppearance(){const form=el("form"),colors={};for(const[k,l]of[["paper","Fundo do site"],["ink","Textos"],["accent","Botões e destaques"],["detail","Detalhes"]]){const input=el("input",{type:"color",id:"color-"+k,value:settings[k]});colors[k]=input;form.append(el("div",{class:"color-field"},[el("label",{for:"color-"+k},l),input]))}const image=formField("Imagem de fundo (link HTTPS)","background-image","url",settings.bgImage,{placeholder:"https://exemplo.com/imagem.jpg"}),status=el("p",{class:"note"}),save=el("button",{type:"submit",class:"button"},"Salvar aparência");form.append(image.wrap,save,status);form.onsubmit=e=>{e.preventDefault();const bg=image.input.value.trim();if(bg){try{if(new URL(bg).protocol!=="https:")throw 0}catch{status.textContent="Use um link HTTPS válido.";return}}const candidate={...settings,bgImage:bg};for(const k of Object.keys(colors))candidate[k]=colors[k].value;saveSettings(candidate,status)};app.append(form)}
async function boot(){
 if(DEMO){onlineReady=true;adminAuthed=false;applySettings({...DEFAULTS,...localData().settings});mode.innerHTML='<strong>Demonstração local</strong> · Os dados são compartilhados com <code>index.html?demo=1</code> neste mesmo navegador.';renderLogin();return}
 mode.textContent="Conectando ao Firebase…";
 try{
  const root="https://www.gstatic.com/firebasejs/11.10.0/";
  const [A,U,F]=await Promise.all([import(root+"firebase-app.js"),import(root+"firebase-auth.js"),import(root+"firebase-firestore.js")]);
  const fb=A.initializeApp(FIREBASE_CONFIG),auth=U.getAuth(fb),db=F.getFirestore(fb);adminAuth=auth;
  const nextMonthStart=m=>{const[y,mo]=m.split("-").map(Number),d=new Date(Date.UTC(y,mo,1));return d.toISOString().slice(0,7)+"-01"};
  remoteCall=async(name,p={})=>{
   if(name==="getPublicSettings"){
    const snap=await F.getDoc(F.doc(db,"settings","public"));return snap.exists()?{...DEFAULTS,...snap.data()}:DEFAULTS;
   }
   if(!auth.currentUser||auth.currentUser.email!==ADMIN_EMAIL)throw Error("Conta sem acesso ao painel.");
   if(name==="adminData"){
    const start=p.month+"-01",end=nextMonthStart(p.month);
    const [rs,bs]=await Promise.all([
     F.getDocs(F.query(F.collection(db,"bookings"),F.where("date",">=",start),F.where("date","<",end))),
     F.getDocs(F.query(F.collection(db,"blocks"),F.where("date",">=",start),F.where("date","<",end)))
    ]);
    return{records:rs.docs.map(d=>({id:d.id,...d.data()})),blocks:bs.docs.map(d=>({id:d.id,...d.data()}))};
   }
   if(name==="updateBooking"){
    const ref=F.doc(db,"bookings",p.id),snap=await F.getDoc(ref);if(!snap.exists())throw Error("Pedido não encontrado.");
    const r={id:snap.id,...snap.data()};
    if(p.action==="verifyPhone"){if(effectiveStatus(r)!=="pending")throw Error(effectiveStatus(r)==="expired"?"A reserva já expirou.":"Esse pedido não está mais pendente.");await F.updateDoc(ref,{phoneVerified:true,phoneVerifiedAt:Date.now()});return{...r,phoneVerified:true}}
    const change=transition(r,p.action,p.amount,p.method),batch=F.writeBatch(db);
    batch.update(ref,{...change,...(p.action==="complete"?{completedAt:Date.now(),paidDate:brazilNow().date}:{})});
    if(p.action==="accept"){
     const ss=await F.getDocs(F.query(F.collection(db,"slots"),F.where("bookingId","==",p.id)));for(const d of ss.docs)batch.delete(d.ref);
     batch.set(F.doc(db,"blocks","booking_"+p.id),{date:r.date,start:r.time,end:r.end,label:"Agendamento confirmado",bookingId:p.id,createdAt:Date.now()});
     if(r.phoneLockKey)batch.delete(F.doc(db,"phoneLocks",r.phoneLockKey));
     if(r.ownerUid)batch.delete(F.doc(db,"clientLocks",r.ownerUid));
    }
    if(p.action==="cancel"){
     const ss=await F.getDocs(F.query(F.collection(db,"slots"),F.where("bookingId","==",p.id)));for(const d of ss.docs)batch.delete(d.ref);
     batch.delete(F.doc(db,"blocks","booking_"+p.id));
     if(r.phoneLockKey)batch.delete(F.doc(db,"phoneLocks",r.phoneLockKey));
     if(r.ownerUid)batch.delete(F.doc(db,"clientLocks",r.ownerUid));
    }
    await batch.commit();return{id:p.id,...r,...change};
   }
   if(name==="setBlock"){
    if(p.remove){await F.deleteDoc(F.doc(db,"blocks",p.remove));return{ok:true}}
    if(p.start>=p.end)throw Error("O fim deve ser depois do início.");
    const [ss,bs]=await Promise.all([
     F.getDocs(F.query(F.collection(db,"slots"),F.where("date","==",p.date))),
     F.getDocs(F.query(F.collection(db,"blocks"),F.where("date","==",p.date)))
    ]);
    const now=Date.now(),activeSlots=ss.docs.filter(d=>{const exp=d.data().expiresAt?.toMillis?.();return!exp||exp>now});const busy=[...activeSlots.map(d=>({start:d.data().minute,end:d.data().minute+10})),...bs.docs.map(d=>({start:d.data().start,end:d.data().end}))];
    if(busy.some(b=>p.start<b.end&&p.end>b.start))throw Error("Existe reserva ou bloqueio nesse intervalo.");
    const id="block_"+crypto.randomUUID();await F.setDoc(F.doc(db,"blocks",id),{date:p.date,start:p.start,end:p.end,label:p.label||"",createdAt:Date.now()});return{ok:true};
   }
   if(name==="savePublicSettings"){
    await F.setDoc(F.doc(db,"settings","public"),p,{merge:true});const snap=await F.getDoc(F.doc(db,"settings","public"));return{...DEFAULTS,...snap.data()};
   }
   throw Error("Operação inválida.");
  };
  loginRemote=async(email,password)=>{const cred=await U.signInWithEmailAndPassword(auth,email,password);if(cred.user.email!==ADMIN_EMAIL){await U.signOut(auth);throw Error("Essa conta não tem acesso ao painel.")}return cred};
  logoutRemote=()=>U.signOut(auth);onlineReady=true;applySettings(await remoteCall("getPublicSettings",{}));mode.textContent="Painel online · conectado ao Firebase";renderLogin();
 }catch(e){onlineReady=false;mode.textContent="Não foi possível conectar ao Firebase. Confira a configuração e as regras do Firestore.";renderLogin();console.error(e)}
}
applySettings(DEFAULTS);boot();
</script>
