<style>
:root{--paper:#FAF8F5;--ink:#242523;--accent:#34594C;--detail:#AD8956;--muted:#646961;--line:#e4e6e0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Archivo,Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}button:disabled{opacity:.4;cursor:not-allowed}a{color:inherit}h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:500;margin:0}p{line-height:1.7}.shell{width:min(1120px,92%);margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:28px 0}.brand{font-family:Fraunces,Georgia,serif;font-size:23px}.brand span{color:var(--accent)}.button{display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:11px;background:var(--accent);color:white;padding:13px 18px;font-size:14px;font-weight:600;text-decoration:none}.button.secondary{background:transparent;color:var(--ink);border-color:var(--line)}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:0 18px 50px #24252308}.notice{padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:12px;font-size:13px;line-height:1.7;color:var(--muted)}.mode{margin-bottom:18px}.panel{padding-bottom:70px}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:15px 0 25px}.panel-head h1{font-size:clamp(34px,5vw,52px);letter-spacing:-1.7px}.note{font-size:13px;color:var(--muted);line-height:1.7}.actions{display:flex;gap:10px;align-items:center;justify-content:flex-start;flex-wrap:wrap}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:20px 0 26px;overflow-x:auto}.tab{white-space:nowrap;border:0;border-bottom:2px solid transparent;background:none;padding:12px 10px;font-size:13px}.tab.active{border-color:var(--accent);color:var(--accent)}.field{margin-bottom:18px}label{display:block;font-size:13px;font-weight:500;margin-bottom:8px}input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:16px}textarea{min-height:90px;resize:vertical}.filter-row{display:flex;gap:14px;align-items:end;flex-wrap:wrap}.filter-row>.field{flex:1;min-width:150px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric{padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff}.metric strong{display:block;font-size:24px;margin-top:7px}.record{padding:18px;border:1px solid var(--line);border-radius:14px;margin:12px 0;background:#fff}.record-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.record .actions{margin-top:12px}.record .button{padding:9px 12px}.badge{font-size:12px;border-radius:20px;padding:6px 10px;background:#f3ead6;color:#715316}.badge.accepted{background:#dfefe7;color:#235941}.badge.cancelled{background:#f9e3e3;color:#8a3333}.badge.completed{background:#e8eaf0;color:#384468}.badge.expired{background:#eee;color:#666}.row{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}.row span:first-child{color:var(--muted)}.error{color:#a43030;font-size:13px}.login{max-width:520px;margin:40px auto}.login h1{font-size:40px;margin-bottom:10px}.color-field{display:flex;justify-content:space-between;align-items:center;margin:15px 0}.color-field input{width:58px;height:40px;padding:3px}summary{cursor:pointer;line-height:1.6}#print-report{display:none}

.agenda-calendar{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin:6px 0 18px}
.agenda-cal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.agenda-cal-title{font-family:Fraunces,Georgia,serif;font-size:24px;text-transform:capitalize}
.agenda-cal-actions{display:flex;gap:8px;align-items:center}
.cal-mini{border:1px solid var(--line);background:transparent;border-radius:10px;padding:9px 12px;font-weight:600}
.agenda-week,.agenda-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.agenda-week{margin-bottom:6px}.agenda-week span{text-align:center;font-size:11px;color:var(--muted);padding:5px 0}
.agenda-day{min-height:72px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px;text-align:left;position:relative}
.agenda-day:hover{border-color:var(--accent)}
.agenda-day.selected{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 6%,white)}
.agenda-day.today .day-number{color:var(--accent)}

.agenda-day.sunday{opacity:.45}
.day-number{font-weight:700;font-size:14px}
.day-count{position:absolute;right:7px;top:7px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;display:grid;place-items:center}
.day-dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:14px}
.day-dot{width:6px;height:6px;border-radius:50%;background:var(--detail)}
.day-dot.accepted{background:var(--accent)}.day-dot.cancelled,.day-dot.expired{opacity:.25}
.day-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 16px}
.day-summary .metric{margin:0}
@media(max-width:600px){.agenda-calendar{padding:12px}.agenda-week,.agenda-days{gap:3px}.agenda-day{min-height:56px;padding:6px}.day-count{right:4px;top:4px}.day-summary{grid-template-columns:1fr 1fr}.agenda-cal-title{font-size:21px}}


.workdays{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:12px 0 22px}
.workday{border:1px solid var(--line);border-radius:12px;padding:12px 8px;background:#fff;text-align:center;cursor:pointer;user-select:none}
.workday input{width:auto;margin:0 0 7px}
.workday.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,white)}

.day-schedule-tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:14px 0 18px}
.day-schedule-tab{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 7px;min-height:58px;font-weight:600}
.day-schedule-tab.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,white)}
.day-schedule-tab small{display:block;color:var(--muted);font-size:10px;font-weight:500;margin-top:5px}
.day-schedule-editor{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}
.day-schedule-editor h4{font-family:Fraunces,Georgia,serif;font-size:24px;margin:0 0 6px}
.day-open-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.day-open-row input{width:auto;transform:scale(1.2)}
.period-card{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;background:var(--paper)}
.period-card .filter-row{margin:0}
.period-card .button{margin-bottom:19px}
@media(max-width:760px){.day-schedule-tabs{grid-template-columns:repeat(4,1fr)}}
@media(max-width:440px){.day-schedule-tabs{grid-template-columns:repeat(2,1fr)}}


.edit-box{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}.service-checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0 16px}.service-check{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}.service-check input{width:auto}.danger{border-color:#c97d7d!important;color:#8a3333!important}.block-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:22px}.block-box{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}.block-box h3{margin:0 0 6px;font-size:22px}.daily-metrics{grid-template-columns:repeat(3,1fr)!important}.payment-note{font-weight:600}.record-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.booking-alerts{margin:18px 0 22px}
.booking-alerts-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.booking-alerts-head h2{font-size:24px}
.booking-alert-count{min-width:28px;height:28px;padding:0 8px;border-radius:999px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.booking-alert-card{border:1px solid var(--line);background:#fff;border-radius:16px;padding:15px;margin:10px 0}
.booking-alert-card.new{border-color:var(--accent)}
.booking-alert-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.booking-alert-title{font-weight:700;font-size:15px}
.booking-alert-meta{font-size:13px;color:var(--muted);line-height:1.6;margin-top:5px}
.booking-alert-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.booking-alert-actions .button{padding:9px 12px}
.booking-toast-stack{position:fixed;right:18px;top:18px;z-index:9999;width:min(390px,calc(100vw - 36px));display:grid;gap:10px}
.booking-toast{background:#fff;border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:16px;padding:15px;box-shadow:0 18px 48px #0002}
.booking-toast-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.booking-toast-close{border:0;background:transparent;font-size:22px;line-height:1;padding:0 4px}
.booking-toast .booking-alert-actions{margin-top:10px}
@media(max-width:600px){.booking-toast-stack{right:10px;top:10px;width:calc(100vw - 20px)}}


.push-panel{border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px;margin:14px 0 18px}
.push-panel-head{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
.push-panel h2{font-size:20px;margin:0 0 4px}
.push-panel .note{margin:0}
.push-state{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:7px 10px;border-radius:999px;background:#f3f3f0}
.push-state.on{background:#e3efe9;color:#245941}
.push-state.off{background:#f7ecec;color:#8b3434}
.push-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}

@media(max-width:800px){.block-grid{grid-template-columns:1fr}.daily-metrics{grid-template-columns:repeat(2,1fr)!important}}
@media(max-width:520px){.service-checks{grid-template-columns:1fr}.daily-metrics{grid-template-columns:1fr 1fr!important}}

@media(max-width:800px){.metrics{grid-template-columns:repeat(2,1fr)}.panel-head{flex-direction:column}.topbar{align-items:flex-start}.card{padding:19px}}
@media(max-width:480px){.metric{padding:13px}.metric strong{font-size:21px}.record{padding:14px}.tabs{margin-left:-4px;margin-right:-4px}.topbar{flex-wrap:wrap}}
@media print{body>*{display:none!important}body>#print-report{display:block!important;background:#fff;color:#000;padding:20px}#print-report h1{font-size:28px}#print-report p{border-bottom:1px solid #ddd;padding-bottom:8px}}
</style>

<body>
<div class="shell"><header class="topbar"><div class="brand">Painel <span>Barbearia</span></div><a class="button secondary" href="index.html">← Site do cliente</a></header><div id="mode" class="notice mode"></div><main id="app" class="panel"></main></div>
<script>
"use strict";
let SERVICES=[{id:"corte",name:"Corte",price:40,duration:30},{id:"barba",name:"Barba",price:20,duration:20},{id:"sobrancelha",name:"Sobrancelha",price:15,duration:20}];
const DEFAULT_WORKING_HOURS={"0":[],"1":[[480,720],[810,1140]],"2":[[480,720],[810,1140]],"3":[[480,720],[810,1140]],"4":[[480,720],[810,1140]],"5":[[480,720],[810,1140]],"6":[[480,720],[810,1140]]};
const DEFAULTS={eyebrow:"Cuidado nos detalhes. Simplicidade ao agendar.",title:"Seu próximo corte começa aqui.",sub:"Escolha seus serviços, encontre um horário livre e acompanhe a confirmação do barbeiro.",paper:"#FAF8F5",ink:"#242523",accent:"#34594C",detail:"#AD8956",bgImage:"",services:SERVICES,workingHours:DEFAULT_WORKING_HOURS,workingDays:[1,2,3,4,5,6],periods:[[480,720],[810,1140]]};
const FIREBASE_CONFIG={
  apiKey:"AIzaSyDkaDl6pxcPVIwMT35yr0tKsvBS4loOatI",
  authDomain:"miguel-barber-bf59f.firebaseapp.com",
  projectId:"miguel-barber-bf59f",
  storageBucket:"miguel-barber-bf59f.firebasestorage.app",
  messagingSenderId:"780950863075",
  appId:"1:780950863075:web:563e16e29b02f207c099d6",
  measurementId:"G-WL7FGT08LK"
};
const ADMIN_EMAIL="prototipo@gmail.com";
const VAPID_KEY="BNlpxpW50aDyBSnZ1usQwjvrjF9XRQYYBwqIzU1pLwXqdxuIJfjb7i_scERQOjBRwr7PZk2osOTXgmCbilU8yy0";
const DEMO=new URLSearchParams(location.search).get("demo")==="1",DEMO_KEY="barbearia:demo:v2";
const app=document.getElementById("app"),mode=document.getElementById("mode");
let settings={...DEFAULTS},workingHours=structuredClone(DEFAULT_WORKING_HOURS),workingDays=[...DEFAULTS.workingDays],periods=DEFAULTS.periods,onlineReady=false,remoteCall,adminAuth,loginRemote,logoutRemote,adminAuthed=false,records=[],blocks=[],adminError="";
let livePending=[],bookingAlertsHost=null,realtimeUnsubscribe=null,realtimeExpiryTimer=null,startRealtimeNotifications=null,stopRealtimeNotifications=null,knownPendingIds=new Set();
let enablePushNotifications=null,refreshPushRegistration=null,pushUiHost=null;
let adminTab="overview",adminMonth=brazilNow().date.slice(0,7),adminDate=brazilNow().date,agendaFilter="all",clientSearch="";
const LABELS={pending:"Aguardando confirmação",accepted:"Confirmado",cancelled:"Cancelado",completed:"Concluído",expired:"Expirado",no_show:"Faltou"};
const PENDING_TTL=60*60*1000;
function bookingExpiry(r){return Number(r?.expiresAt)||(Number(r?.createdAt)||0)+PENDING_TTL}
function effectiveStatus(r){return r?.status==="pending"&&bookingExpiry(r)&&Date.now()>=bookingExpiry(r)?"expired":r?.status}
function normalizeRecord(r){const status=effectiveStatus(r);return status===r.status?r:{...r,status}}
function money(n){return new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(n)}function pad(n){return String(n).padStart(2,"0")}function clock(n){return pad(Math.floor(n/60))+":"+pad(n%60)}function fmtDate(d){return d?.split("-").reverse().join("/")||""}function brazilNow(){const p=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).map(x=>[x.type,x.value]));return{date:`${p.year}-${p.month}-${p.day}`,minute:+p.hour*60 + +p.minute}}
function validDate(date){if(typeof date!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(date))return false;const d=new Date(date+"T12:00:00Z");return Number.isFinite(+d)&&d.toISOString().slice(0,10)===date}
function normalizeWorkingHours(cfg={}){
 const source=cfg.workingHours;
 if(source&&typeof source==="object"){
  const out={};for(let d=0;d<7;d++)out[String(d)]=Array.isArray(source[String(d)])?source[String(d)].map(p=>[Number(p[0]),Number(p[1])]).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1])&&p[0]<p[1]):[];
  return out;
 }
 const days=Array.isArray(cfg.workingDays)?cfg.workingDays.map(Number):DEFAULTS.workingDays,ps=Array.isArray(cfg.periods)?cfg.periods:DEFAULTS.periods;
 const out={};for(let d=0;d<7;d++)out[String(d)]=days.includes(d)?ps.map(p=>[Number(p[0]),Number(p[1])]):[];return out;
}
function serviceSelection(ids){
 if(!Array.isArray(ids)||!ids.length)throw Error("Selecione pelo menos um serviço.");
 const items=ids.map(id=>SERVICES.find(s=>s.id===id));
 if(items.some(x=>!x))throw Error("Um dos serviços não existe mais.");
 return{items,duration:items.reduce((n,s)=>n+Number(s.duration||0),0),price:items.reduce((n,s)=>n+Number(s.price||0),0)};
}
function scheduleAllows(date,start,duration){
 if(!validDate(date)||!Number.isInteger(start)||!Number.isFinite(duration)||duration<=0)return false;
 const dow=new Date(date+"T12:00:00Z").getUTCDay(),ps=workingHours[String(dow)]||[];
 return ps.some(([a,b])=>start>=a&&start+duration<=b);
}
function dateRange(start,end,maxDays=90){
 if(!validDate(start)||!validDate(end)||end<start)throw Error("Confira o período de datas.");
 const out=[],a=new Date(start+"T12:00:00Z"),b=new Date(end+"T12:00:00Z");
 for(let d=new Date(a);d<=b;d.setUTCDate(d.getUTCDate()+1)){if(out.length>=maxDays)throw Error("Escolha no máximo "+maxDays+" dias por vez.");out.push(d.toISOString().slice(0,10))}
 return out;
}
function localData(){try{return JSON.parse(localStorage.getItem(DEMO_KEY)||"null")||{records:[],blocks:[],settings:{}}}catch{return{records:[],blocks:[],settings:{}}}}function saveLocal(d){localStorage.setItem(DEMO_KEY,JSON.stringify(d))}
function transition(record,action,amount,method){
 const status=effectiveStatus(record);
 if(action==="accept"&&status==="pending")return{status:"accepted",acceptedAt:Date.now()};
 if(action==="cancel"&&["pending","accepted","completed","no_show"].includes(status))return{status:"cancelled",cancelledAt:Date.now(),paidCents:null,method:null,paidDate:null,completedAt:null,noShowAt:null};
 if(action==="complete"&&status==="accepted"){
  if(!Number.isFinite(amount)||amount<0||amount>10000||!["Pix","Dinheiro","Débito","Crédito"].includes(method))throw Error("Informe valor e pagamento válidos.");
  return{status:"completed",paidCents:Math.round(amount*100),method};
 }
 if(action==="noShow"&&status==="accepted")return{status:"no_show",noShowAt:Date.now()};
 if(status==="expired")throw Error("A reserva expirou após 1 hora e o horário já foi liberado.");
 throw Error("Esse atendimento já mudou de situação.");
}
function demoDay(d,date){return{busy:[...d.records.filter(r=>r.date===date&&!(["cancelled","expired"].includes(effectiveStatus(r)))).map(r=>({start:r.time,end:r.end,id:r.id})),...d.blocks.filter(b=>b.date===date)]}}
async function api(name,p={}){
 if(!DEMO){if(!onlineReady)throw Error("Conexão online ainda não configurada.");return remoteCall(name,p)}
 const d=localData(),cfg={...DEFAULTS,...d.settings};
 if(name==="getPublicSettings")return cfg;
 if(!adminAuthed)throw Error("Entre no painel.");
 if(name==="adminData")return{records:d.records.filter(r=>r.date.startsWith(p.month)).map(normalizeRecord),blocks:d.blocks.filter(r=>r.date.startsWith(p.month))};
 if(name==="updateBooking"){
  const r=d.records.find(r=>r.id===p.id);if(!r)throw Error("Pedido não encontrado.");
  const current=effectiveStatus(r);
  if(p.action==="verifyPhone"){
   if(current!=="pending")throw Error(current==="expired"?"A reserva já expirou.":"Esse pedido não está mais pendente.");
   r.phoneVerified=true;r.phoneVerifiedAt=Date.now();saveLocal(d);return r;
  }
  if(p.action==="editPayment"){
   if(current!=="completed")throw Error("Somente atendimento concluído pode ter o pagamento editado.");
   const amount=Number(p.amount);if(!Number.isFinite(amount)||amount<0||amount>10000||!["Pix","Dinheiro","Débito","Crédito"].includes(p.method))throw Error("Informe valor e pagamento válidos.");
   r.paidCents=Math.round(amount*100);r.method=p.method;r.paymentEditedAt=Date.now();saveLocal(d);return r;
  }
  if(p.action==="edit"){
   if(!["pending","accepted"].includes(current))throw Error("Só é possível editar um agendamento pendente ou confirmado.");
   const sel=serviceSelection(p.serviceIds),price=Number(p.price),date=p.date,time=Number(p.time);
   if(!Number.isFinite(price)||price<0||price>10000)throw Error("Informe um valor válido.");
   if(!scheduleAllows(date,time,sel.duration))throw Error("Esse horário está fora do expediente configurado.");
   const busyRecords=d.records.filter(x=>x.id!==r.id&&x.date===date&&!['cancelled','expired','no_show'].includes(effectiveStatus(x))).map(x=>({start:x.time,end:x.end}));
   const busyBlocks=d.blocks.filter(x=>x.date===date&&x.bookingId!==r.id).map(x=>({start:x.start,end:x.end}));
   if([...busyRecords,...busyBlocks].some(b=>time<b.end&&time+sel.duration>b.start))throw Error("Esse horário já está ocupado.");
   Object.assign(r,{date,time,end:time+sel.duration,services:sel.items,price,editedAt:Date.now()});saveLocal(d);return r;
  }
  Object.assign(r,transition(r,p.action,p.amount,p.method));
  if(p.action==="complete"){r.completedAt=Date.now();r.paidDate=brazilNow().date}
  saveLocal(d);return r;
 }
 if(name==="setBlock"){
  if(p.remove){d.blocks=d.blocks.filter(b=>!(b.date===p.date&&b.id===p.remove));saveLocal(d);return{ok:true}}
  if(p.start>=p.end)throw Error("O fim deve ser depois do início.");
  if(demoDay(d,p.date).busy.some(b=>p.start<b.end&&p.end>b.start))throw Error("Existe reserva ou bloqueio nesse intervalo.");
  d.blocks.push({...p,id:"block_"+Date.now()+"_"+Math.random().toString(36).slice(2),block:true});saveLocal(d);return{ok:true};

    const now=Date.now(),activeSlots=ss.docs.filter(d=>{const exp=d.data().expiresAt?.toMillis?.();return!exp||exp>now});const busy=[...activeSlots.map(d=>({start:d.data().minute,end:d.data().minute+10})),...bs.docs.map(d=>({start:d.data().start,end:d.data().end}))];
    if(busy.some(b=>p.start<b.end&&p.end>b.start))throw Error("Existe reserva ou bloqueio nesse intervalo.");
    const id="block_"+crypto.randomUUID();await F.setDoc(F.doc(db,"blocks",id),{date:p.date,start:p.start,end:p.end,label:p.label||"",createdAt:Date.now()});return{ok:true};
   }
   if(name==="setBlockRange"){
    const dates=dateRange(p.startDate,p.endDate),start=Number(p.start),end=Number(p.end);if(start>=end)throw Error("Confira o horário do bloqueio.");
    const [ss,bs]=await Promise.all([
     F.getDocs(F.query(F.collection(db,"slots"),F.where("date",">=",p.startDate),F.where("date","<=",p.endDate))),
     F.getDocs(F.query(F.collection(db,"blocks"),F.where("date",">=",p.startDate),F.where("date","<=",p.endDate)))
    ]);
    const now=Date.now(),activeSlots=ss.docs.filter(d=>!d.data().expiresAt?.toMillis?.()||d.data().expiresAt.toMillis()>now);
    for(const date of dates){
     if(activeSlots.some(d=>d.data().date===date&&start<d.data().minute+10&&end>d.data().minute)||bs.docs.some(d=>d.data().date===date&&start<d.data().end&&end>d.data().start))throw Error("Existe atendimento ou bloqueio em "+fmtDate(date)+". Ajuste esse dia primeiro.");
    }
    const batch=F.writeBatch(db),group="range_"+crypto.randomUUID();for(const date of dates)batch.set(F.doc(db,"blocks",group+"_"+date),{date,start,end,label:p.label||"Folga / férias",rangeGroup:group,createdAt:Date.now()});await batch.commit();return{ok:true,count:dates.length};
   }
   if(name==="savePublicSettings"){
    await F.setDoc(F.doc(db,"settings","public"),p,{merge:true});const snap=await F.getDoc(F.doc(db,"settings","public"));return{...DEFAULTS,...snap.data()};
   }
   throw Error("Operação inválida.");
  };
  loginRemote=async(email,password)=>{
   const cred=await U.signInWithEmailAndPassword(auth,email,password);
   if(cred.user.email!==ADMIN_EMAIL){
    await U.signOut(auth);
    throw Error("Essa conta não tem acesso ao painel.");
   }
   return cred;
  };
  logoutRemote=()=>U.signOut(auth);

  onlineReady=true;
  applySettings(await remoteCall("getPublicSettings",{}));
  mode.textContent="Painel online · conectado ao Firebase";

  // Aguarda o Firebase restaurar a sessão salva neste aparelho.
  if(typeof auth.authStateReady==="function")await auth.authStateReady();

  const savedUser=auth.currentUser;
  if(savedUser&&savedUser.email===ADMIN_EMAIL){
   adminAuthed=true;
   await refreshAdmin();
   if(startRealtimeNotifications)startRealtimeNotifications();
   renderAdmin();
   if(refreshPushRegistration)refreshPushRegistration();
  }else{
   if(savedUser)await U.signOut(auth);
   adminAuthed=false;
   renderLogin();
  }
 }catch(e){
  onlineReady=false;
  mode.textContent="Não foi possível conectar ao Firebase. Confira a configuração e as regras do Firestore.";
  renderLogin();
  console.error(e);
 }
}
applySettings(DEFAULTS);boot();
</script>
